name: Auto Create Git Tag and Trigger Release

on:
  push:
    branches:
      - main  # main 브랜치에 머지되면 실행

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest version tag
        id: get-latest-tag
        run: |
          # 최신 태그 가져오기 (v 형식만)
          latest_tag=$(git tag --sort=-v:refname | grep '^v' | head -n 1)
          echo "Latest tag: $latest_tag"

          # 태그 없으면 v0.0.0으로 시작
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          # 버전 숫자 증가 (예: v1.2.3 → v1.2.4)
          version=$(echo $latest_tag | sed 's/^v//' | awk -F. '{ printf("v%d.%d.%d", $1, $2, $3+1) }')
          echo "Next version: $version"
          echo "next_tag=$version" >> "$GITHUB_OUTPUT"

      - name: Create new Git tag
        run: |
          git tag ${{ steps.get-latest-tag.outputs.next_tag }}
          git push origin ${{ steps.get-latest-tag.outputs.next_tag }}
